# tmux is only here so a run survives a browser disconnect (ADR 0005).
# Every route from tmux to a shell is removed: no prefix, no key bindings, no status line, no mouse.
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
set -g status off
# The gaffer account's login shell is nologin; tmux runs the pane command via default-shell.
set -g default-shell /bin/sh
set -g mouse off
set -g exit-empty on
set -g escape-time 10
set -g history-limit 10000
# Let Pi tell Shift+Enter from Enter (Pi docs: tmux.md, tmux ≥ 3.5).
set -g extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
# Keep the browser terminal on its normal screen (no smcup/rmcup), so lines that scroll off the top land in
# xterm.js's own scrollback and the mouse wheel / scrollbar work natively. tmux mouse and copy-mode stay off.
set -ga terminal-overrides ",*:smcup@:rmcup@"
