# Spike S10: real-model checks on Pi 1.3.0 with the M1.1-1 configuration (Pi's catalogue model entry,
# no models.json override), using the S2 images (gaffer-harness:s2, gaffer-sandbox:s2; never rebuilt here).
#   docker compose -p gaffer-s10 -f spikes/s10-real-model-1x/docker-compose.s10.yml up -d
# Differences from deploy/compose/docker-compose.yml: project gaffer-s10, the :s2 images, no published port
# (the eval runs through `exec`), its own volumes, the real key secret referenced read-only from
# deploy/compose/secrets (never copied), and a throwaway salt in ./secrets.
name: gaffer-s10

services:
  gaffer:
    image: gaffer-harness:s2
    networks: [egress, sandbox_net]
    init: true
    environment:
      GAFFER_PROVIDER: anthropic
      GAFFER_MODEL: claude-sonnet-5-5
      GAFFER_THINKING: medium
      SANDBOX_PROVIDER: compose
      SANDBOX_URL: http://sandbox:8080
    secrets: [anthropic_api_key, gaffer_id_salt]
    volumes:
      - sessions:/sessions
      - data:/data
    depends_on: [sandbox]

  sandbox:
    image: gaffer-sandbox:s2
    networks: [sandbox_net]
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /work:size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - data:/data:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../../sandbox/seccomp/moby-default-v27.3.1.json
    pids_limit: 128
    mem_limit: 2g
    cpus: 2

networks:
  egress: {}
  sandbox_net:
    internal: true

volumes:
  sessions: {}
  data: {}

secrets:
  anthropic_api_key:
    file: ../../deploy/compose/secrets/anthropic_api_key
  gaffer_id_salt:
    file: ./secrets/gaffer_id_salt
