# S11: an allowlisting forward proxy, the harness's only way out. CONNECT to 443 only, by name only.
http_port 3128
acl allowed dstdomain api.anthropic.com fantasy.premierleague.com football-data.co.uk
acl ssl_ports port 443
acl CONNECT method CONNECT
# A CONNECT to an IP literal names no host to check: refuse it.
acl ip_literal url_regex -i ^\[?[0-9a-f.:]+\]?:[0-9]+$
http_access deny CONNECT ip_literal
http_access deny CONNECT !ssl_ports
http_access deny !CONNECT
http_access allow CONNECT allowed
http_access deny all
cache deny all
access_log daemon:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename none
