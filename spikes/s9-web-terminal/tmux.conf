# tmux is only here so a run survives a browser disconnect (ADR 0005).
# Every route from tmux to a shell is removed: no prefix, no key bindings, no status line, no mouse.
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
set -g status off
# The gaffer account's login shell is nologin; tmux runs the pane command via default-shell.
set -g default-shell /bin/sh
set -g mouse off
set -g exit-empty on
set -g escape-time 10
set -g history-limit 10000
# Let Pi tell Shift+Enter from Enter (Pi docs: tmux.md, tmux ≥ 3.5).
set -g extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
# Pi runs in fullscreen mode (harness/gaffer-pi) and owns scrolling. tmux's own mouse handling and
# copy-mode stay off; Pi's mouse requests still reach the browser terminal, so the wheel scrolls Pi's
# transcript.

# --- S9 additions (not in the harness) ---
# Forward the pane title (Pi's OSC 0) to the browser tab, and let Pi's OSC 52 copies reach xterm.js.
set -g set-titles on
set -g set-titles-string '#T'
set -g set-clipboard on
set -as terminal-features ",xterm-256color:clipboard:hyperlinks:title"
