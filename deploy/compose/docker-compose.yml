# Gaffer, local single-user (ADR 0006). Run from this directory:
#   ./init-secrets.sh && docker compose up --build   then open http://127.0.0.1:7682 (the App) or :7681 (the terminal)
# Shared through Cloudflare Tunnel with Access in front (ADR 0015), once its token and host names are set:
#   docker compose up -d tunnel      on
#   docker compose stop tunnel       off
name: gaffer

services:
  gaffer:
    # The brain: Pi + pi-gaffer + ttyd. Holds the LLM key, fetches FPL data, owns the session log.
    build:
      context: ../..
      dockerfile: harness/Dockerfile
    image: gaffer-harness:local
    ports:
      - "127.0.0.1:7681:7681"   # the Gaffer Terminal; localhost only (NFR-SEC-04)
      - "127.0.0.1:7682:7682"   # the Gaffer App (ADR 0014); localhost only
    networks: [egress, sandbox_net]
    init: true
    environment:
      GAFFER_PROVIDER: ${GAFFER_PROVIDER:-anthropic}
      GAFFER_MODEL: ${GAFFER_MODEL:-claude-sonnet-5-5}
      GAFFER_THINKING: ${GAFFER_THINKING:-medium}
      # The browser terminal's palette, dark or light; Pi follows it with gaffer-dark or gaffer-light (ADR 0013).
      GAFFER_TERMINAL_THEME: ${GAFFER_TERMINAL_THEME:-dark}
      GAFFER_BUDGET_SOFT: ${GAFFER_BUDGET_SOFT:-0.75}
      GAFFER_BUDGET_HARD: ${GAFFER_BUDGET_HARD:-1.50}
      GAFFER_BUDGET_DAILY: ${GAFFER_BUDGET_DAILY:-5}
      # Another provider's key, for GAFFER_PROVIDER/GAFFER_MODEL or `pnpm eval --model` (NFR-PORT-01). Empty unless set on the host.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SANDBOX_PROVIDER: compose
      SANDBOX_URL: http://sandbox:8080
      # The tunnel's host names (ADR 0015), from .env; empty, the App answers on 127.0.0.1/localhost only. Set whether
      # the tunnel runs or not, so switching it never recreates this container.
      GAFFER_PUBLIC_APP_HOST: ${GAFFER_PUBLIC_APP_HOST:-}
      GAFFER_PUBLIC_TERMINAL_HOST: ${GAFFER_PUBLIC_TERMINAL_HOST:-}
    secrets: [anthropic_api_key, gaffer_id_salt]
    volumes:
      - sessions:/sessions
      - data:/data
    depends_on: [sandbox]
    restart: unless-stopped

  sandbox:
    # The hands: runs generated code. No network beyond the harness, no secrets, non-root, read-only root.
    build:
      context: ../..
      dockerfile: sandbox/Dockerfile
    image: gaffer-sandbox:local
    networks: [sandbox_net]
    init: true   # tini as PID 1 reaps orphaned children (e.g. after a killed fork bomb)
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /work:size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - data:/data:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Explicit, because a daemon may default to unconfined (sandbox/seccomp/README.md).
      - seccomp=../../sandbox/seccomp/moby-default-v27.3.1.json
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

  tunnel:
    # The way in from outside (ADR 0015): Cloudflare's connector dials out to Cloudflare and forwards the App's and the
    # terminal's host names to gaffer:7682 and gaffer:7681. Cloudflare Access checks who it is first, and the connector
    # checks Access's token again ("Protect with Access" on each route). Only with `docker compose up -d tunnel`.
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflared_token"]
    networks: [egress]   # never sandbox_net; no ports: nothing listens on the host
    secrets: [cloudflared_token]   # its own token only: no LLM key, no salt
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on: [gaffer]
    restart: unless-stopped

networks:
  egress: {}
  sandbox_net:
    internal: true   # no route out: the sandbox reaches only the harness

volumes:
  sessions: {}
  data: {}

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  gaffer_id_salt:
    file: ./secrets/gaffer_id_salt
  cloudflared_token:
    file: ./secrets/cloudflared_token
