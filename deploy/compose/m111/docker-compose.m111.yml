# Milestone M1.1-1's evidence stack: Gaffer from this branch as its own Compose project beside the live `gaffer` one.
#   docker compose -p gaffer-m111 -f deploy/compose/m111/docker-compose.m111.yml up -d --build
# Stack checks, from deploy/compose:
#   GAFFER_PROJECT=gaffer-m111 GAFFER_PORT=17683 COMPOSE_FILE=m111/docker-compose.m111.yml ./tests/verify.sh
# Differences from deploy/compose/docker-compose.yml (the pattern of spikes S2 and S10): project gaffer-m111,
# image tags :m111 (the live stack's :local images are never rebuilt), host port 17683, its own volumes, no
# restart policy, the real key secret referenced read-only from deploy/compose/secrets (never copied) and a
# throwaway salt in ./secrets.
name: gaffer-m111

services:
  gaffer:
    build:
      context: ../../..
      dockerfile: harness/Dockerfile
    image: gaffer-harness:m111
    ports:
      - "127.0.0.1:17683:7681"
    networks: [egress, sandbox_net]
    init: true
    environment:
      GAFFER_PROVIDER: anthropic
      GAFFER_MODEL: claude-sonnet-5-5
      GAFFER_THINKING: medium
      SANDBOX_PROVIDER: compose
      SANDBOX_URL: http://sandbox:8080
    secrets: [anthropic_api_key, gaffer_id_salt]
    volumes:
      - sessions:/sessions
      - data:/data
    depends_on: [sandbox]

  sandbox:
    build:
      context: ../../..
      dockerfile: sandbox/Dockerfile
    image: gaffer-sandbox:m111
    networks: [sandbox_net]
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /work:size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - data:/data:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../../../sandbox/seccomp/moby-default-v27.3.1.json
    pids_limit: 128
    mem_limit: 2g
    cpus: 2

networks:
  egress: {}
  sandbox_net:
    internal: true

volumes:
  sessions: {}
  data: {}

secrets:
  anthropic_api_key:
    file: ../secrets/anthropic_api_key
  gaffer_id_salt:
    file: ./secrets/gaffer_id_salt
