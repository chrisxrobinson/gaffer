# Milestone M1.1-4's evidence stack: Gaffer from this branch as its own Compose project beside the live `gaffer` one.
#   docker compose -p gaffer-m114 -f deploy/compose/m114/docker-compose.m114.yml up -d --build
# Stack checks, from deploy/compose:
#   GAFFER_PROJECT=gaffer-m114 GAFFER_PORT=17687 GAFFER_APP_PORT=17688 COMPOSE_FILE=m114/docker-compose.m114.yml ./tests/verify.sh
# Differences from deploy/compose/docker-compose.yml (the pattern of spikes S2 and S10): project gaffer-m114,
# image tags :m114 (the live stack's :local images are never rebuilt), host ports 17687 (terminal) and 17688 (App), its own volumes, no
# restart policy, the real key secret referenced read-only from deploy/compose/secrets (never copied) and a
# throwaway salt in ./secrets.
name: gaffer-m114

services:
  gaffer:
    build:
      context: ../../..
      dockerfile: harness/Dockerfile
    image: gaffer-harness:m114
    ports:
      - "127.0.0.1:17687:7681"   # the Gaffer Terminal
      - "127.0.0.1:17688:7682"   # the Gaffer App
    networks: [egress, sandbox_net]
    init: true
    environment:
      GAFFER_PROVIDER: anthropic
      GAFFER_MODEL: claude-sonnet-5-5
      GAFFER_THINKING: medium
      GAFFER_TERMINAL_THEME: ${GAFFER_TERMINAL_THEME:-dark}
      GAFFER_TERMINAL_URL: http://127.0.0.1:17687/   # the Result's "Open in terminal" link
      SANDBOX_PROVIDER: compose
      SANDBOX_URL: http://sandbox:8080
    secrets: [anthropic_api_key, gaffer_id_salt]
    volumes:
      - sessions:/sessions
      - data:/data
    depends_on: [sandbox]

  sandbox:
    build:
      context: ../../..
      dockerfile: sandbox/Dockerfile
    image: gaffer-sandbox:m114
    networks: [sandbox_net]
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /work:size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - data:/data:ro
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../../../sandbox/seccomp/moby-default-v27.3.1.json
    pids_limit: 128
    mem_limit: 2g
    cpus: 2

networks:
  egress: {}
  sandbox_net:
    internal: true

volumes:
  sessions: {}
  data: {}

secrets:
  anthropic_api_key:
    file: ../secrets/anthropic_api_key
  gaffer_id_salt:
    file: ./secrets/gaffer_id_salt
